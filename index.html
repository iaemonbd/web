<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imtiaz Azad Emon | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --primary:#00d4aa;--primary-glow:rgba(0,212,170,0.4);--primary-light:#00ffc8;--primary-dark:#00a888;
  --tg:#2AABEE;--tg-dark:#1E8CDA;--dark:#0a0a0f;--card:#111118;--border:rgba(255,255,255,0.07);
  --text:#f0f0f0;--muted:#888;--success:#00ff9f;--warning:#ffb800;--danger:#e63946;
  --accent:#3b9dff;--accent-hot:#4f6dff;--accent-glow:rgba(59,157,255,0.15);--accent-hot-glow:rgba(79,109,255,0.12);
  --transition:all 0.4s cubic-bezier(0.25,1,0.5,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:var(--dark);}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:10px;}
body{font-family:'Mulish',sans-serif;background:var(--dark);color:var(--text);line-height:1.7;overflow-x:hidden;cursor:none;}
a,button,input,select,textarea{cursor:none;}

/* ── BG ANIMATION (particles + orbs + grid + noise + vignette + scanline) ── */
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:-9;background:radial-gradient(ellipse at center,#0a0f1a 0%,#000000 70%);}
.bg-orb{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:-10;}
.bg-orb-1{width:600px;height:600px;background:radial-gradient(circle,var(--accent-glow),transparent 70%);top:-200px;right:-100px;animation:orbFloat1 14s ease-in-out infinite alternate;}
.bg-orb-2{width:500px;height:500px;background:radial-gradient(circle,var(--accent-hot-glow),transparent 70%);bottom:-150px;left:-100px;animation:orbFloat2 12s ease-in-out infinite alternate;}
.bg-orb-3{width:350px;height:350px;background:radial-gradient(circle,rgba(59,157,255,0.07),transparent 70%);top:40%;left:45%;animation:orbFloat3 16s ease-in-out infinite alternate;}
.bg-orb-4{width:250px;height:250px;background:radial-gradient(circle,rgba(79,109,255,0.06),transparent 70%);top:20%;left:15%;animation:orbFloat1 18s ease-in-out infinite alternate-reverse;}
@keyframes orbFloat1{0%{transform:translate(0,0) scale(1);}33%{transform:translate(40px,-50px) scale(1.12);}66%{transform:translate(-30px,30px) scale(0.92);}100%{transform:translate(20px,-20px) scale(1.06);}}
@keyframes orbFloat2{0%{transform:translate(0,0) scale(1);}33%{transform:translate(-35px,40px) scale(0.95);}66%{transform:translate(25px,-35px) scale(1.1);}100%{transform:translate(-15px,15px) scale(1.03);}}
@keyframes orbFloat3{0%{transform:translate(0,0) scale(1);}50%{transform:translate(50px,-30px) scale(1.15);}100%{transform:translate(-20px,20px) scale(0.9);}}
.bg-grid{position:fixed;inset:0;z-index:-10;background-image:linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(ellipse 70% 70% at center,black 20%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse 70% 70% at center,black 20%,transparent 70%);animation:gridPulse 8s ease-in-out infinite alternate;}
@keyframes gridPulse{0%{opacity:0.6;}100%{opacity:1;}}
.bg-noise{position:fixed;inset:0;z-index:-8;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");opacity:0.6;}
.bg-vignette{position:fixed;inset:0;z-index:-7;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.5) 100%);}
.bg-scanline{position:fixed;left:0;right:0;height:2px;z-index:-6;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(59,157,255,0.06),transparent);animation:scanMove 6s linear infinite;}
@keyframes scanMove{0%{top:-2px;}100%{top:100%;}}

/* ── CURSOR — exact new.html, z-index above everything incl. admin ── */
.cursor-dot,.cursor-outline{position:fixed;top:0;left:0;border-radius:50%;pointer-events:none;z-index:999999;transform:translate(-50%,-50%);}
.cursor-dot{width:8px;height:8px;background:var(--primary);}
.cursor-outline{width:40px;height:40px;border:2px solid rgba(0,212,170,0.5);transition:width 0.3s,height 0.3s,border-color 0.3s;}
.cursor-outline.hovered{width:60px;height:60px;border-color:var(--primary-light);background:rgba(0,212,170,0.1);}

/* ── LOADER ── */
.loader{position:fixed;inset:0;background:var(--dark);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:30px;transition:opacity 0.8s ease,visibility 0.8s ease;}
.loader.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.loader-text{font-family:'Syne',sans-serif;font-size:42px;font-weight:800;color:#fff;display:flex;gap:4px;}
.loader-text span{opacity:0;transform:translateY(40px);animation:ldrChar 0.5s ease forwards;}
.loader-text span:nth-child(1){animation-delay:0.1s}
.loader-text span:nth-child(2){animation-delay:0.17s}
.loader-text span:nth-child(3){animation-delay:0.24s}
.loader-text span:nth-child(4){animation-delay:0.31s}
.loader-text span:nth-child(5){animation-delay:0.38s}
.loader-text span:nth-child(6){animation-delay:0.45s}
.loader-text span:nth-child(7){animation-delay:0.52s}
@keyframes ldrChar{to{opacity:1;transform:translateY(0)}}
.loader-bar{width:200px;height:3px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;}
.loader-fill{height:100%;width:0;background:var(--primary);border-radius:10px;animation:ldrFill 2.1s ease forwards;}
@keyframes ldrFill{to{width:100%}}
.scroll-progress{position:fixed;top:80px;left:0;width:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--primary-light));z-index:1001;transition:width 0.1s linear;}

/* ── KEYFRAMES ── */
@keyframes morph{0%,100%{border-radius:30% 70% 70% 30%/30% 30% 70% 70%}25%{border-radius:58% 42% 75% 25%/76% 46% 54% 24%}50%{border-radius:50% 50% 33% 67%/55% 27% 73% 45%}75%{border-radius:24% 76% 26% 74%/26% 21% 79% 74%}}
@keyframes floatSlow{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-15px) rotate(3deg)}}
@keyframes floatAnim{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 5px var(--primary-glow)}50%{box-shadow:0 0 25px var(--primary-glow),0 0 50px rgba(0,212,170,0.15)}}
@keyframes blinkAnim{0%,100%{border-color:var(--primary)}50%{border-color:transparent}}
@keyframes spinAnim{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes borderGlow{0%,100%{border-color:rgba(0,212,170,0.3)}50%{border-color:rgba(0,212,170,0.8)}}
@keyframes floatIcon{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulseStatus{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(0.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes snapPulse{0%{box-shadow:0 0 0 0 rgba(42,171,238,0.6)}50%{box-shadow:0 0 0 15px rgba(42,171,238,0)}100%{box-shadow:0 0 0 0 rgba(42,171,238,0)}}

/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(50px);transition:opacity 0.8s ease-out,transform 0.8s ease-out;}
.reveal.active{opacity:1;transform:translateY(0);}
.reveal-left{opacity:0;transform:translateX(-60px);transition:opacity 0.8s ease-out,transform 0.8s ease-out;}
.reveal-left.active{opacity:1;transform:translateX(0);}
.reveal-right{opacity:0;transform:translateX(60px);transition:opacity 0.8s ease-out,transform 0.8s ease-out;}
.reveal-right.active{opacity:1;transform:translateX(0);}
.reveal-scale{opacity:0;transform:scale(0.85);transition:opacity 0.8s ease-out,transform 0.8s ease-out;}
.reveal-scale.active{opacity:1;transform:scale(1);}

/* ── HEADER ── */
header{position:fixed;top:0;width:100%;height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 8%;background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:1000;transition:var(--transition);}
header.scrolled{height:65px;background:rgba(10,10,15,0.97);box-shadow:0 5px 30px rgba(0,0,0,0.4);}
.logo{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:#fff;text-decoration:none;position:relative;}
.logo em{font-style:normal;color:var(--primary);}
.logo::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:var(--primary);transition:width 0.3s;}
.logo:hover::after{width:100%;}
nav{display:flex;gap:6px;align-items:center;}
nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;transition:var(--transition);padding:8px 16px;border-radius:25px;position:relative;}
nav a::before{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--primary);transition:width 0.3s;border-radius:2px;}
nav a:hover::before,nav a.active::before{width:50%;}
nav a:hover,nav a.active{color:var(--primary);}
.menu-toggle{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:10px;}
.menu-toggle span{width:25px;height:2px;background:#fff;transition:var(--transition);border-radius:2px;}
.menu-toggle.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.menu-toggle.open span:nth-child(2){opacity:0;}
.menu-toggle.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}

/* ── SECTIONS ── */
section{padding:120px 8%;position:relative;z-index:1;}
.section-header{margin-bottom:70px;}
.section-header h3{font-family:'Syne',sans-serif;font-size:38px;margin-bottom:10px;display:inline-block;position:relative;z-index:2;}
.section-header h3::after{content:'';position:absolute;bottom:5px;left:0;width:100%;height:14px;background:var(--primary);z-index:-1;opacity:0.2;transform:skewX(-12deg);transition:width 0.5s;}
.section-header:hover h3::after{width:80%;}
.section-header p{color:var(--muted);max-width:500px;font-size:16px;}

/* ── HERO ── */
.hero{min-height:100vh;display:flex;align-items:center;padding:140px 8% 80px;gap:60px;}
.hero-text{flex:1;}
.hero-tag{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;background:rgba(0,212,170,0.1);border:1px solid rgba(0,212,170,0.2);border-radius:30px;color:var(--primary);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:25px;animation:borderGlow 3s infinite;}
.hero-tag .dot{width:8px;height:8px;background:var(--primary);border-radius:50%;animation:pulseGlow 2s infinite;}
.hero-text h1{font-family:'Syne',sans-serif;font-size:clamp(40px,5.5vw,75px);line-height:1.05;margin-bottom:10px;}
.name-first{display:block;color:#fff;}
.name-last{display:block;color:var(--primary);position:relative;}
.name-last::after{content:'';position:absolute;bottom:5px;left:0;width:100%;height:8px;background:var(--primary);opacity:0.2;z-index:-1;}
.typing-wrapper{font-size:20px;color:var(--muted);margin-bottom:30px;height:30px;display:flex;align-items:center;gap:8px;}
.typing-wrapper i{color:var(--primary);}
.typing-text{border-right:2px solid var(--primary);padding-right:5px;animation:blinkAnim 0.8s infinite;}
.hero-desc{color:var(--muted);max-width:520px;margin-bottom:40px;font-size:17px;}
.cta-group{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:50px;}
.btn{padding:15px 35px;border-radius:50px;font-weight:700;text-decoration:none;transition:var(--transition);display:inline-flex;align-items:center;gap:10px;font-size:15px;position:relative;overflow:hidden;border:none;cursor:pointer;font-family:'Mulish',sans-serif;}
.btn::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:rgba(255,255,255,0.15);transform:translate(-50%,-50%);transition:width 0.6s,height 0.6s;}
.btn:hover::before{width:300px;height:300px;}
.btn-primary{background:var(--primary);color:var(--dark);box-shadow:0 10px 25px rgba(0,212,170,0.25);font-weight:800;}
.btn-primary:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,212,170,0.35);}
.btn-outline{border:1px solid var(--border);color:#fff;background:transparent;}
.btn-outline:hover{background:rgba(255,255,255,0.05);border-color:var(--primary);color:var(--primary);}
.hero-stats{display:flex;gap:40px;margin-top:20px;}
.stat-item{text-align:center;}
.stat-number{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;color:var(--primary);display:block;line-height:1;}
.stat-label{font-size:13px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:1px;}
.social-bar{display:flex;gap:12px;margin-top:35px;}
.social-bar a{width:48px;height:48px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;border:1px solid var(--border);transition:var(--transition);font-size:16px;}
.social-bar a:hover{background:var(--primary);border-color:var(--primary);transform:translateY(-5px) scale(1.1);color:var(--dark);}
.hero-visual{flex:1;position:relative;display:flex;justify-content:center;align-items:center;}
.hero-visual::before{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(0,212,170,0.12) 0%,transparent 70%);border-radius:50%;filter:blur(60px);animation:floatSlow 6s ease-in-out infinite;}
.img-wrapper{position:relative;z-index:2;}
.img-wrapper::before{content:'';position:absolute;top:20px;left:20px;right:-20px;bottom:-20px;border:2px solid var(--primary);border-radius:30% 70% 70% 30%/30% 30% 70% 70%;animation:morph 8s ease-in-out infinite;opacity:0.3;}
.img-wrapper::after{content:'';position:absolute;top:-15px;right:15px;left:-15px;bottom:15px;border:1px dashed rgba(0,212,170,0.2);border-radius:50% 50% 33% 67%/55% 27% 73% 45%;animation:spinAnim 30s linear infinite;}
.img-container{width:100%;max-width:400px;aspect-ratio:1/1.15;background:linear-gradient(135deg,var(--primary-dark),#005a48);border-radius:30% 70% 70% 30%/30% 30% 70% 70%;overflow:hidden;animation:morph 8s ease-in-out infinite;box-shadow:0 30px 60px rgba(0,0,0,0.5),0 0 40px var(--primary-glow);}
.img-container img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s;}
.img-container:hover img{transform:scale(1.08);}
.floating-badge{position:absolute;z-index:3;background:var(--card);border:1px solid var(--border);padding:12px 20px;border-radius:16px;backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,0.3);animation:floatSlow 4s ease-in-out infinite;}
.floating-badge.b1{top:10%;right:-10%;}
.floating-badge.b2{bottom:15%;left:-5%;animation-delay:1.2s;}
.floating-badge i{color:var(--primary);font-size:18px;}
.floating-badge span{font-size:13px;font-weight:600;color:#fff;}

/* ── TIMELINE ── */
.timeline{position:relative;padding-left:40px;}
.timeline::before{content:'';position:absolute;left:15px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--primary),var(--border));}
.timeline-item{position:relative;margin-bottom:50px;padding-left:30px;}
.timeline-item::before{content:'';position:absolute;left:-33px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--dark);border:3px solid var(--primary);transition:var(--transition);z-index:2;}
.timeline-item:hover::before{background:var(--primary);box-shadow:0 0 20px var(--primary-glow);transform:scale(1.3);}
.exp-card{background:var(--card);border:1px solid var(--border);padding:35px;border-radius:20px;transition:var(--transition);position:relative;overflow:hidden;}
.exp-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:0;background:var(--primary);transition:height 0.4s;border-radius:0 4px 4px 0;}
.exp-card:hover::before{height:100%;}
.exp-card:hover{border-color:var(--primary);transform:translateY(-5px) translateX(5px);box-shadow:0 15px 40px rgba(0,0,0,0.3),0 0 30px rgba(0,212,170,0.08);}
.exp-date{color:var(--primary);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:1px;}
.exp-date i{font-size:12px;animation:floatIcon 3s infinite;}
.exp-card h4{font-family:'Syne',sans-serif;font-size:22px;margin-bottom:5px;transition:color 0.3s;}
.exp-card:hover h4{color:var(--primary);}
.exp-company{color:#aaa;margin-bottom:20px;display:block;font-size:15px;font-style:italic;}
.exp-card ul{list-style:none;}
.exp-card li{margin-bottom:12px;color:var(--muted);padding-left:25px;position:relative;font-size:15px;transition:all 0.3s;}
.exp-card li::before{content:"▹";color:var(--primary);position:absolute;left:0;font-size:16px;}
.exp-card:hover li{color:#bbb;transform:translateX(4px);}

/* ── EDUCATION ── */
.edu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;}
.edu-card{background:var(--card);border:1px solid var(--border);padding:35px;border-radius:20px;transition:var(--transition);position:relative;overflow:hidden;}
.edu-card::after{content:'';position:absolute;top:-50%;right:-50%;width:100%;height:100%;background:radial-gradient(circle,rgba(0,212,170,0.06) 0%,transparent 70%);transition:var(--transition);}
.edu-card:hover{border-color:var(--primary);transform:translateY(-8px) scale(1.02);box-shadow:0 15px 40px rgba(0,0,0,0.3);}
.edu-card:hover::after{top:-30%;right:-30%;}
.edu-icon{width:50px;height:50px;border-radius:12px;background:rgba(0,212,170,0.1);display:flex;align-items:center;justify-content:center;margin-bottom:20px;font-size:22px;color:var(--primary);transition:var(--transition);}
.edu-card:hover .edu-icon{background:var(--primary);color:var(--dark);transform:rotate(10deg) scale(1.1);}
.edu-date{color:var(--primary);font-weight:700;margin-bottom:8px;display:block;font-size:13px;letter-spacing:1px;}
.edu-card h4{font-family:'Syne',sans-serif;font-size:20px;margin-bottom:5px;}
.edu-card .edu-school{color:#aaa;font-size:14px;font-style:italic;}
.edu-grade{margin-top:15px;padding-top:15px;border-top:1px solid var(--border);}
.edu-grade strong{color:var(--primary);font-family:'Syne',sans-serif;}

/* ── SKILLS ── */
.bg-shape{position:absolute;border-radius:50%;filter:blur(100px);z-index:-1;opacity:0.3;}
.shape-1{top:10%;right:5%;width:350px;height:350px;background:var(--primary);animation:floatAnim 7s ease-in-out infinite;}
.shape-2{bottom:15%;left:5%;width:250px;height:250px;background:#004a3a;animation:floatAnim 9s ease-in-out infinite reverse;}
.tabs-nav{display:flex;justify-content:center;gap:12px;margin-bottom:40px;flex-wrap:wrap;}
.tab-btn{padding:11px 26px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:14px;font-weight:600;border-radius:50px;transition:var(--transition);display:flex;align-items:center;gap:8px;cursor:none;font-family:'Mulish',sans-serif;}
.tab-btn:hover{color:#fff;border-color:rgba(0,212,170,0.4);}
.tab-btn.active{background:linear-gradient(135deg,var(--primary),#00a878);color:var(--dark);border-color:transparent;font-weight:700;box-shadow:0 0 25px var(--primary-glow);}
.tab-panel{display:none;animation:fadeIn 0.45s ease;}
.tab-panel.active{display:block;}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;}
.skill-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 20px;text-align:center;transition:var(--transi
