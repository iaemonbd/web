function decode(){
  const raw=atob(P);
  let out="";
  for(let i=0;i<raw.length;i++) out+=String.fromCharCode(raw.charCodeAt(i)^K.charCodeAt(i%K.length));
  return decodeURIComponent(escape(out));

const original=decode();

/* Runtime protection is installed after the immutable original payload is rendered. */
function installProtection(){
  try{
    const style=document.createElement("style");
    style.id="__security_print_guard";
    style.textContent=`
      @media print {
        html, body { display:none !important; visibility:hidden !important; }
      }
      .__security_restricted{
        position:fixed; inset:0; z-index:2147483647;
        display:flex; align-items:center; justify-content:center;
        background:#05050a; color:#f0f0f0; font-family:Arial,sans-serif;
        text-align:center; padding:30px;
      }
      .__security_restricted_box{
        max-width:520px; padding:42px; border:1px solid rgba(0,212,170,.3);
        border-radius:18px; background:#111118; box-shadow:0 25px 70px rgba(0,0,0,.55);
      }
      .__security_restricted h2{margin:0 0 10px;font-size:28px}
      .__security_restricted p{margin:0;color:#999;font-size:14px;line-height:1.6}
    `;
    document.head.appendChild(style);

    const restricted=document.createElement("div");
    restricted.className="__security_restricted";
    restricted.id="__security_restricted";
    restricted.hidden=true;
    restricted.innerHTML='<div class="__security_restricted_box"><h2>Access Restricted</h2><p>Developer tools are not permitted on this page.</p></div>';
    document.body.appendChild(restricted);

    const editable=el=>{
      if(!el) return false;
      const tag=(el.tagName||"").toLowerCase();
      return tag==="input" || tag==="textarea" || tag==="select" || el.isContentEditable;
    };

    document.addEventListener("contextmenu",e=>e.preventDefault(),true);
    document.addEventListener("dragstart",e=>{
      if(e.target && (e.target.tagName==="IMG" || e.target.closest && e.target.closest("img"))) e.preventDefault();
    },true);
    document.addEventListener("selectstart",e=>{
      if(!editable(e.target)) e.preventDefault();
    },true);

    document.addEventListener("keydown",e=>{
      const k=(e.key||"").toLowerCase();
      const mod=e.ctrlKey||e.metaKey;
      const blocked =
        k==="f12" ||
        (mod && k==="u") ||
        (mod && k==="s") ||
        (mod && e.shiftKey && (k==="i" || k==="j" || k==="c")) ||
        (mod && k==="p");
      if(blocked){
        e.preventDefault();
        e.stopPropagation();
      }
    },true);

    let wasOpen=false;
    const checkDevTools=()=>{
      const threshold=160;
      const open =
        Math.abs(window.outerWidth-window.innerWidth)>threshold ||
        Math.abs(window.outerHeight-window.innerHeight)>threshold;
      if(open && !wasOpen){
        restricted.hidden=false;
        wasOpen=true;
        try{ debugger; }catch(_){}
      }else if(!open && wasOpen){
        restricted.hidden=true;
        wasOpen=false;
      }
    };

    setInterval(checkDevTools,1500);
    checkDevTools();
  }catch(_){}
