<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1117">
<title>CSE 74D Class Routine</title>
<style>
:root{
  --bg:#0c1117;--card:#151b25;--ink:#eef3ff;--mute:#a9b3c8;--line:#273041;
  --off:#7aa5ff;--off-bg:#1a294a;--on:#61d7aa;--on-bg:#153d33;--brk:#7d879d;
  --warn:#f0c06b;--warn-bg:#3a2d12;--lift-bg:#e7edf8;--lift-ink:#121a27;
  --shadow:0 10px 28px rgba(2,6,23,.38);
  --soft-ring:rgba(122,165,255,.35);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:
    radial-gradient(circle at top left, rgba(91,119,170,.20), transparent 32%),
    radial-gradient(circle at bottom right, rgba(97,215,170,.10), transparent 28%),
    var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",Arial,sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.4;
}
button{touch-action:manipulation}

.wrap{max-width:560px;margin:0 auto;padding:0 14px 120px}

/* ---------- header ---------- */
.hero{padding:22px 4px 6px}
.hero h1{margin:0;font-size:30px;line-height:1.15;letter-spacing:-.03em;font-weight:800}
.hero p{margin:6px 0 0;color:var(--mute);font-size:15px;font-weight:600}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---------- chips ---------- */
.chip{
  display:inline-flex;align-items:center;font-size:12px;font-weight:700;line-height:1;
  padding:6px 11px;border-radius:999px;white-space:nowrap;
}
.c-off{background:var(--off-bg);color:var(--off)}
.c-on{background:var(--on-bg);color:var(--on)}
.c-dur{background:var(--line);color:var(--mute)}
.c-upd{background:var(--warn-bg);color:var(--warn)}
.c-today{background:var(--ink);color:var(--bg)}
.c-lift{background:var(--lift-bg);color:var(--lift-ink)}
.c-now{background:var(--on);color:#06251c}
.c-next{background:var(--off-bg);color:var(--off);box-shadow:inset 0 0 0 1px var(--off)}

/* ---------- day heading ---------- */
section + section{margin-top:8px}
.dayhead{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:20px 2px 12px;
}
.dayhead h2{margin:0;font-size:22px;letter-spacing:-.02em}
.dayhead .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- class cards ---------- */
.list{display:grid;gap:12px}
.slot{
  --accent:var(--brk);
  position:relative;display:grid;grid-template-columns:88px 1fr;
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  overflow:hidden;box-shadow:var(--shadow);
}
.slot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.slot.offline{--accent:var(--off)}
.slot.online{--accent:var(--on)}
.slot.now{border-color:var(--on);box-shadow:0 0 0 1px var(--on),var(--shadow)}
.slot.done{opacity:.5}

.when{
  padding:14px 8px 14px 16px;display:flex;flex-direction:column;align-items:flex-start;
  background:rgba(255,255,255,.025);border-right:1px solid var(--line);
}
.start{font-size:19px;font-weight:800;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ap{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--accent)}
.to{margin-top:10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.end{font-size:13px;font-weight:700;line-height:1.2;color:var(--mute);font-variant-numeric:tabular-nums}

.body{padding:14px;display:grid;gap:6px;align-content:start;min-width:0}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.title{margin:0;font-size:17px;line-height:1.3;font-weight:800;letter-spacing:-.01em}
.code{font-size:12px;color:var(--mute);letter-spacing:.02em;font-weight:600}
.teacher{font-size:14px;color:var(--mute);font-weight:600}
.loc{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
.prog i{display:block;height:100%;background:var(--on)}

/* break row */
.slot.break{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;background:transparent;border-style:dashed;
  box-shadow:none;border-radius:16px;
}
.slot.break::before{display:none}
.slot.break .title{font-size:15px;font-weight:700;color:var(--mute)}
.slot.break .time{font-size:13px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- bottom day switcher (thumb friendly) ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  display:flex;justify-content:center;pointer-events:none;
  padding:18px 10px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top, rgba(12,17,23,.96) 55%, rgba(12,17,23,0));
}
.bar-in{
  pointer-events:auto;display:flex;gap:4px;width:100%;max-width:520px;padding:6px;
  border-radius:22px;background:rgba(21,27,37,.94);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 12px 30px rgba(2,6,23,.5);
}
.tab{
  flex:1;min-width:0;min-height:54px;border:0;border-radius:16px;background:transparent;color:var(--mute);
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:background .2s ease,color .2s ease;
}
.tab:active{transform:scale(.96)}
.tab:focus-visible{outline:3px solid var(--soft-ring);outline-offset:1px}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--brk)}
.tab .dot.offline{background:var(--off)}
.tab .dot.online{background:var(--on)}
.tab.today .dot{box-shadow:0 0 0 3px rgba(255,255,255,.28)}
.tab.act{background:var(--ink);color:var(--bg)}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim .slot{animation:rise .32s ease both}
.anim .slot:nth-child(2){animation-delay:.04s}
.anim .slot:nth-child(3){animation-delay:.08s}
.anim .slot:nth-child(4){animation-delay:.12s}
.anim .slot:nth-child(5){animation-delay:.16s}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}

@media (max-width:359px){
  .slot{grid-template-columns:78px 1fr}
  .start{font-size:17px}
  .title{font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>Class Routine</h1>
    <p>CSE 74D, Fall 2026</p>
    <div class="legend">
      <span class="chip c-off">On campus: Fri, Sat</span>
      <span class="chip c-on">Online: Mon, Tue, Wed</span>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="bar" id="tabs" aria-label="Choose a day"></nav>
<script>
(function () {
  // Lift number for each room. Change a number here if a room is on a different lift.
  var LIFT = { "307": 2, "402": 3, "403": 3, "201": 1 };

  function R(s, e, title, code, teacher, room, label) {
    return { s: s, e: e, title: title, code: code, teacher: teacher, room: room, label: label, kind: "offline" };
  }
  function O(s, e, title, code, teacher, updated) {
    return { s: s, e: e, title: title, code: code, teacher: teacher, kind: "online", updated: !!updated };
  }
  function B(s, e, title) {
    return { s: s, e: e, title: title, kind: "break" };
  }

  var DAYS = [
    { id: 5, name: "Friday", short: "Fri", mode: "offline", slots: [
      R("08:50", "09:40", "Discrete Math", "MAT 06882124", "Shamsun Nahar", "307", "Room 307"),
      R("11:20", "12:10", "Intro to Programming", "CSE 06131209", "Shihab Uddin Sikder", "403", "Room 403"),
      B("13:00", "14:20", "Break and prayer"),
      R("14:20", "15:10", "Physics-I", "PHY 05331104", "Dr. Shafiul Islam", "402", "Room 402"),
      R("15:10", "16:00", "Professional Communication", "ENG 02311216", "Md. Atik Ullah Masud", "402", "Room 402")
    ] },
    { id: 6, name: "Saturday", short: "Sat", mode: "offline", slots: [
      R("16:00", "16:50", "Intro to Programming Lab", "CSE 06131210", "Shihab Uddin Sikder", "201", "Lab 201")
    ] },
    { id: 1, name: "Monday", short: "Mon", mode: "online", slots: [
      O("21:00", "22:00", "Physics-I", "PHY 05331104", "Dr. Shafiul Islam")
    ] },
    { id: 2, name: "Tuesday", short: "Tue", mode: "online", slots: [
      O("19:00", "20:00", "Intro to Programming", "CSE 06131209", "Shihab Uddin Sikder"),
      O("20:00", "21:00", "Discrete Math", "MAT 06882124", "Shamsun Nahar")
    ] },
    { id: 3, name: "Wednesday", short: "Wed", mode: "online", updated: true, slots: [
      O("20:00", "21:00", "Professional Communication", "ENG 02311216", "Md. Atik Ullah Masud", true)
    ] }
  ];

  var todayId = new Date().getDay();
  var hasToday = DAYS.some(function (d) { return d.id === todayId; });
  var sel = hasToday ? todayId : "all";

  function parts(t) {
    var p = t.split(":");
    var h = Number(p[0]);
    return { hm: ((h % 12) || 12) + ":" + p[1], ap: h >= 12 ? "PM" : "AM" };
  }
  function t12(t) {
    var x = parts(t);
    return x.hm + " " + x.ap;
  }
  function mins(t) {
    var p = t.split(":");
    return Number(p[0]) * 60 + Number(p[1]);
  }
  function fmt(d) {
    var h = Math.floor(d / 60);
    var m = d % 60;
    var out = "";
    if (h) out += h + "h";
    if (m) out += (out ? " " : "") + m + "m";
    return out;
  }
  function dur(s, e) {
    return fmt(mins(e) - mins(s));
  }

  // For today's classes: which one is running now, which is next, which are finished.
  function statusFor(d) {
    var out = [];
    if (d.id !== todayId) return out;
    var n = new Date();
    var nowM = n.getHours() * 60 + n.getMinutes();
    var nextDone = false;
    d.slots.forEach(function (x, i) {
      if (x.kind === "break") { out[i] = null; return; }
      var s = mins(x.s);
      var e = mins(x.e);
      if (nowM >= s && nowM < e) {
        out[i] = { k: "now", note: fmt(e - nowM) + " left", pct: Math.round((nowM - s) / (e - s) * 100) };
      } else if (nowM >= e) {
        out[i] = { k: "done" };
      } else if (!nextDone) {
        nextDone = true;
        out[i] = { k: "next", note: "in " + fmt(s - nowM) };
      } else {
        out[i] = null;
      }
    });
    return out;
  }

  function slotHtml(x, st) {
    if (x.kind === "break") {
      return '<article class="slot break"><span class="title">' + x.title + '</span>' +
        '<span class="time">' + t12(x.s) + " – " + t12(x.e) + "</span></article>";
    }
    var a = parts(x.s);
    var cls = "slot " + x.kind;
    var badges = "";
    var prog = "";
    if (st) {
      if (st.k === "now") {
        cls += " now";
        badges += '<span class="chip c-now">Now · ' + st.note + "</span>";
        prog = '<div class="prog"><i style="width:' + st.pct + '%"></i></div>';
      } else if (st.k === "next") {
        badges += '<span class="chip c-next">Next · ' + st.note + "</span>";
      } else if (st.k === "done") {
        cls += " done";
      }
    }
    if (x.updated) badges += '<span class="chip c-upd">New time</span>';

    var loc;
    if (x.kind === "offline") {
      var lift = LIFT[x.room];
      loc = '<span class="chip c-off">' + x.label + "</span>";
      if (lift) loc += '<span class="chip c-lift">Lift ' + lift + "</span>";
    } else {
      loc = '<span class="chip c-on">Online live class</span>';
    }
    loc += '<span class="chip c-dur">' + dur(x.s, x.e) + "</span>";

    return '<article class="' + cls + '">' +
      '<div class="when"><span class="start">' + a.hm + '</span><span class="ap">' + a.ap + "</span>" +
        '<span class="to">until</span><span class="end">' + t12(x.e) + "</span></div>" +
      '<div class="body">' +
        (badges ? '<div class="badges">' + badges + "</div>" : "") +
        '<h3 class="title">' + x.title + "</h3>" +
        '<span class="code">' + x.code + "</span>" +
        '<div class="teacher">' + x.teacher + "</div>" +
        '<div class="loc">' + loc + "</div>" +
      "</div>" + prog + "</article>";
  }

  function dayHtml(d) {
    var tags = "";
    if (d.id === todayId) tags += '<span class="chip c-today">Today</span>';
    if (d.updated) tags += '<span class="chip c-upd">Updated</span>';
    tags += d.mode === "offline"
      ? '<span class="chip c-off">On campus</span>'
      : '<span class="chip c-on">Online</span>';
    var st = statusFor(d);
    var items = d.slots.map(function (x, i) { return slotHtml(x, st[i]); }).join("");
    return '<section><div class="dayhead"><h2>' + d.name + '</h2><div class="tags">' + tags + "</div></div>" +
      '<div class="list">' + items + "</div></section>";
  }

  function tabBtn(id, label, mode, isToday) {
    var active = sel === id;
    return '<button type="button" class="tab' + (active ? " act" : "") + (isToday ? " today" : "") +
      '" data-id="' + id + '" aria-pressed="' + (active ? "true" : "false") + '"' +
      (isToday ? ' aria-current="date"' : "") + ">" +
      '<span class="dot ' + (mode || "") + '"></span><span>' + label + "</span></button>";
  }

  function renderTabs() {
    var h = '<div class="bar-in">' + tabBtn("all", "All", "", false);
    DAYS.forEach(function (d) { h += tabBtn(d.id, d.short, d.mode, d.id === todayId); });
    h += "</div>";
    document.getElementById("tabs").innerHTML = h;
  }

  function renderView(animate) {
    var list = sel === "all" ? DAYS : DAYS.filter(function (d) { return d.id === sel; });
    var v = document.getElementById("view");
    v.className = animate ? "anim" : "";
    v.innerHTML = list.map(dayHtml).join("");
  }

  function render(animate) {
    renderView(animate);
    renderTabs();
  }

  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-id]");
    if (!b) return;
    sel = b.getAttribute("data-id") === "all" ? "all" : Number(b.getAttribute("data-id"));
    render(true);
    window.scrollTo(0, 0);
  });

  // Keep the Now / Next labels fresh while the page stays open.
  function tick() {
    var t = new Date().getDay();
    var changed = t !== todayId;
    todayId = t;
    renderView(false);
    if (changed) renderTabs();
  }
  setInterval(tick, 30000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) tick();
  });

  render(true);
})();
</script>
</body>
</html>
